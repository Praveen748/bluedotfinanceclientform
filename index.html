<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Dot Finance Advisory - Client Intake</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h2 { color: var(--primary); margin-top: 0; }
    .step { display: none; }
    .step.active { display: block; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }
    .radio-group { display: flex; gap: 15px; flex-wrap: wrap; }
    .radio-card {
      flex: 1;
      min-width: 120px;
      border: 1px solid #cbd5e1;
      padding: 15px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .radio-card:hover { border-color: var(--accent); }
    .radio-card input { display: none; }
    .radio-card.selected {
      border-color: var(--accent);
      background-color: #eff6ff;
      font-weight: bold;
    }
    .btn-group { display: flex; justify-content: space-between; margin-top: 25px; }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }
    .book-call-box {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 2px dashed #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>Blue Dot Advisory Services</h2>

  <form id="intakeForm">

    <!-- STEP 1: Main Goal Selection + Book a Call -->
    <div class="step active" id="step1">
      <h3>Select Your Requirement</h3>
      <div class="form-group">
        <label>What service are you interested in?</label>
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="service_type" value="Investment" onclick="selectRadio(this)"> Investment
          </label>
          <label class="radio-card">
            <input type="radio" name="service_type" value="Insurance" onclick="selectRadio(this)"> Insurance
          </label>
          <label class="radio-card">
            <input type="radio" name="service_type" value="Both" onclick="selectRadio(this)"> Both
          </label>
        </div>
      </div>

      <div class="btn-group">
        <div></div>
        <button type="button" class="btn-primary" onclick="nextStep(2)">Continue Intake</button>
      </div>

      <!-- FEATURE 1: BOOK A CALL SECTION -->
      <div class="book-call-box">
        <h3>Need Quick Help? Book a Call</h3>
        <p style="font-size: 13px; color: #64748b;">Prefer to speak directly with an advisor instead of filling out the full form?</p>
        
        <div class="form-group">
          <input type="text" id="call_name" placeholder="Your Name">
        </div>
        <div class="form-group">
          <input type="text" id="call_place" placeholder="City / Location">
        </div>
        <div class="form-group">
          <input type="tel" id="call_phone" placeholder="Phone Number">
        </div>
        <div class="form-group">
          <input type="datetime-local" id="call_time">
        </div>
        <button type="button" class="btn-primary" style="width:100%" onclick="submitCallBooking()">Book a Call Now</button>
      </div>
    </div>

    <!-- FEATURE 2: SELF OR FAMILY (Inserted right after Step 1) -->
    <div class="step" id="step2">
      <h3>Who is this coverage/investment for?</h3>
      <div class="form-group">
        <div class="radio-group">
          <label class="radio-card">
            <input type="radio" name="target_audience" value="Self" onclick="selectRadio(this)"> For Myself
          </label>
          <label class="radio-card">
            <input type="radio" name="target_audience" value="Family" onclick="selectRadio(this)"> For My Family
          </label>
        </div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="nextStep(1)">Back</button>
        <button type="button" class="btn-primary" onclick="nextStep(3)">Next</button>
      </div>
    </div>

    <!-- REMAINING STEPS: Rest of your original intake form -->
    <div class="step" id="step3">
      <h3>Contact Information</h3>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" name="full_name" required>
      </div>
      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" name="phone" required>
      </div>
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" name="email">
      </div>
      <div class="btn-group">
        <button type="button" class="btn-secondary" onclick="nextStep(2)">Back</button>
        <button type="button" class="btn-primary" onclick="submitFullForm()">Submit Intake</button>
      </div>
    </div>

  </form>
</div>

<script>
  const CONFIG = {
    // Replace with your production Google Apps Script /exec URL
    endpoint: "https://script.google.com/macros/s/AKfycby0uZw-7H5STpglMEWogrDh5WhAr316A6c_yb6cfHOcPNyFja9xOVRYW0Eh7_mn0dk1ug/exec",
    token: "bd-7Kq29xLm4ZpR83vT"
  };

  let currentStep = 1;

  function selectRadio(el) {
    const parent = el.closest('.radio-group');
    parent.querySelectorAll('.radio-card').forEach(card => card.classList.remove('selected'));
    el.closest('.radio-card').classList.add('selected');
  }

  function nextStep(stepNumber) {
    document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
    document.getElementById('step' + stepNumber).classList.add('active');
    currentStep = stepNumber;
  }

  // Handle Book a Call direct submission to "Book a Call" sheet tab
  function submitCallBooking() {
    const name = document.getElementById('call_name').value;
    const place = document.getElementById('call_place').value;
    const phone = document.getElementById('call_phone').value;
    const time = document.getElementById('call_time').value;

    if (!name || !phone) {
      alert("Please provide at least your Name and Phone Number to book a call.");
      return;
    }

    const payload = {
      token: CONFIG.token,
      form_type: "Book a Call",
      name: name,
      location: place,
      phone: phone,
      preferred_time: time
    };

    sendData(payload, "Call Request Submitted! We will get back to you shortly.");
  }

  // Handle full form submission to "Responses" sheet tab
  function submitFullForm() {
    const form = document.getElementById('intakeForm');
    const formData = new FormData(form);
    const data = { token: CONFIG.token, form_type: "Full Intake" };
    
    formData.forEach((val, key) => data[key] = val);

    if (!data.phone || !data.full_name) {
      alert("Please fill out your Name and Phone Number.");
      return;
    }

    sendData(data, "Thank you! Your intake request has been received.");
  }

  function sendData(payload, successMsg) {
    fetch(CONFIG.endpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      alert(successMsg);
      location.reload();
    })
    .catch(err => alert("Submission error: " + err));
  }
</script>
</body>
</html>
